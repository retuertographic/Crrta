<!--# Lo que cambia en cada página y cada idioma: title, description,
     canonical, og: y hreflang. Lo genera scripts/build_site.py a partir
     de src/meta.json. Está aquí dentro a propósito: así ninguna página
     puede quedarse sin canonical. -->
<!--{{SEO}}-->

<!--# Migas de pan para Google, en las páginas que cuelgan de la portada. -->
<!--{{BREADCRUMBS}}-->

<!--# Las tres fuentes que se ven sin bajar: el titular (Playfair), su
     remate manuscrito (Yellowtail) y el texto corrido (Poppins). Las demás
     variantes las pide el CSS cuando hacen falta. -->
<link rel="preload" href="{{PREFIX}}assets/fonts/playfair-display-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{PREFIX}}assets/fonts/yellowtail-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{PREFIX}}assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
<!--# El icono es la cabeza del logotipo, no el logotipo entero: a 16 y 32
     píxeles el nombre no se lee y solo ensucia. El .ico va en la raíz
     porque los navegadores lo piden ahí sin que nadie se lo diga. -->
<link rel="icon" href="{{PREFIX}}favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="{{PREFIX}}img/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="{{PREFIX}}img/apple-touch-icon.png">
<link rel="stylesheet" href="{{PREFIX}}assets/site.css">
<!--{{ANALYTICS}}-->
