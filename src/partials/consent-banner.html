<!--# Solo se publica si hay IDs en src/analytics.json. Rechazar cuesta lo
     mismo que aceptar: los dos botones, mismo tamaño y mismo nivel. -->
<div class="cookie-banner" id="cookieBanner" role="dialog" aria-live="polite"
     data-i18n-attr="aria-label=cookie_title" aria-label="Cookies">
  <div class="cookie-box">
    <div class="cookie-copy">
      <strong data-i18n="cookie_title">Cookies</strong>
      <p data-i18n="cookie_text">Usamos cookies de medición para saber qué partes de la web se visitan. Solo se activan si las aceptas.</p>
      <a class="cookie-link" href="{{HOME}}legal.html#cookies" data-i18n="cookie_more">Más información</a>
    </div>
    <div class="cookie-actions">
      <button type="button" class="btn ghost" data-consent="reject" data-i18n="cookie_reject">Rechazar</button>
      <button type="button" class="btn" data-consent="accept" data-i18n="cookie_accept">Aceptar</button>
    </div>
  </div>
</div>
