name: Actualizar carta

on:
  schedule:
    # Todos los días a las 06:00 UTC (07:00 u 08:00 hora peninsular).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Extraer la carta
        run: python scripts/build_menu.py --fetch

      - name: Publicar los cambios
        run: |
          if git diff --quiet -- menu-data.json; then
            echo "Sin cambios en la carta."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-data.json
          git commit -m "Actualizar carta desde la carta digital"
          git push
